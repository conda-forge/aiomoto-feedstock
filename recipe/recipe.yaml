schema_version: 1

context:
  python_min: 3.10
  version: "0.5.2"

package:
  name: aiomoto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiomoto/aiomoto-${{ version }}.tar.gz
  sha256: e434e64cf69254e76652b418352e6c8f172facb3b0736ed03182b417ea0c12fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.9,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - aiobotocore >=2.24.1,<=2.25.1
    - moto >=5.1.5,<=5.1.19
    - platformdirs >=4.0.0

tests:
  - python:
      imports:
        - aiomoto
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Moto-style AWS service mocks for aiobotocore/aioboto3
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/aiomoto/

extra:
  recipe-maintainers:
    - peterbygrave
